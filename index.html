<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Get F*ing Jacked!">
<meta name="theme-color" content="#181c20">
<title>Get F*ing Jacked!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181c20; --panel:#22272d; --panel2:#2b3138; --line:#363d45;
  --ink:#eceff2; --muted:#8e98a3; --dim:#5d6670;
  --pin:#ffc53d; --pin-ink:#1d1a10; --good:#5fd39a; --hurt:#ff7a66;
  --display:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body:'Barlow', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.screen{padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto}
.screen.has-timer{padding-bottom:calc(190px + var(--safe-b))}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.kicker{color:var(--muted);font-weight:500;font-size:15px}
h1{font:800 44px/0.95 var(--display);margin:2px 0 0;letter-spacing:-0.01em;text-transform:none}
h2{font:700 26px/1 var(--display);margin:28px 0 12px}
.sub{color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{border-color:#5a3a33;color:#ffb3a6}

/* block meter: 4 weeks */
.blockbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 6px}
.blockbar i{height:6px;border-radius:2px;background:var(--line)}
.blockbar i.past{background:var(--dim)}
.blockbar i.now{background:var(--pin)}
.blocklabels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--dim);font-weight:600}
.blocklabels span.now{color:var(--pin)}

.avoid{margin:14px 0 4px;padding:12px 14px;background:#2a2321;border-radius:12px;font-size:14px;color:#f3c9bf}
.avoid b{color:#ffd8cf}

/* exercise list */
.ex{background:var(--panel);border-radius:16px;margin:10px 0;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;width:100%;text-align:left}
.ex-main{flex:1;min-width:0}
.ex-name{font:700 21px/1.1 var(--display)}
.ex-meta{color:var(--muted);font-size:14px;margin-top:3px}
.ex.done .ex-name{color:var(--muted)}
.ex-more{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
.ex-more:active{background:var(--panel2)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ex.done .tick{background:var(--good);border-color:var(--good)}
.ex.done .tick::after{content:'';width:10px;height:6px;border:2.5px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.first{display:inline-block;color:var(--pin);font-weight:600}

.sets{padding:0 12px 12px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 52px;gap:7px;align-items:center;padding:5px 0}
.set-head{padding:0;color:var(--dim);font-size:12px;font-weight:600;text-align:center}
.set-n{color:var(--dim);font:700 18px var(--display);text-align:center}
.field{display:flex;align-items:center;background:var(--panel2);border-radius:12px;height:52px;overflow:hidden}
.field button{width:32px;height:100%;color:var(--muted);font-size:22px;flex:none}
.field button:active{background:var(--line)}
.field input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;font:700 23px var(--display);padding:0;font-variant-numeric:tabular-nums}
.field input:focus{outline:none;background:#323941}
.field .unit{font-size:12px;color:var(--dim);margin-right:6px;font-weight:600}
.check{height:52px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:24px;height:24px;stroke:var(--dim)}
.set.done .check{background:var(--good);border-color:var(--good)}
.set.done .check svg{stroke:var(--bg)}
.set.done .field input{color:var(--muted)}
.set-actions{display:flex;gap:8px;margin-top:6px}
.ghost{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.ghost:active{background:var(--panel2)}

.btn-main{display:block;width:100%;height:58px;border-radius:16px;background:var(--pin);color:var(--pin-ink);font:800 24px var(--display);letter-spacing:0.01em;margin-top:18px}
.btn-main:active{filter:brightness(0.92)}
.btn-quiet{display:block;width:100%;height:50px;border-radius:14px;border:1px solid var(--line);font-weight:600;color:var(--ink);margin-top:10px}
.btn-danger{color:var(--hurt)}
.elapsed{font:700 26px var(--display);color:var(--pin);font-variant-numeric:tabular-nums}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(24,28,32,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke:var(--pin)}

/* rest timer dock: a weight stack that drains */
.timer{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--safe-b));z-index:38;max-width:540px;margin:0 auto;background:#0f1215;border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:62px 1fr;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,0.5)}
.timer.over{border-color:var(--pin)}
.stack{display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%;min-height:96px;position:relative;padding:0 6px}
.plate{height:6px;border-radius:2px;background:#2a3037;transition:background .3s}
.plate.lit{background:#59636e}
.plate.pin{background:var(--pin)}
.timer-body{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.timer-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.timer-label{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-time{font:800 54px/0.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.timer.over .timer-time{color:var(--pin)}
.timer-btns{display:grid;grid-template-columns:1fr 1fr .8fr 1.3fr;gap:8px;margin-top:10px}
.timer-btns button{height:42px;border-radius:12px;background:var(--panel2);font-weight:700}
.timer-btns button.skip{background:var(--ink);color:var(--bg)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safe-b));max-height:86dvh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:700 26px/1.05 var(--display);margin:4px 0 6px}
.sheet p{color:var(--muted);margin:0 0 12px;font-size:15px}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
.row-btn:last-child{border-bottom:0}
.row-btn small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.row-btn .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:17px}
.row-btn.hurt .ic{background:#3a2622;color:var(--hurt)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.opt{height:50px;border-radius:12px;background:var(--panel2);font-weight:700;border:2px solid transparent}
.opt.on{border-color:var(--pin);color:var(--pin)}
textarea{width:100%;min-height:70px;background:var(--panel2);border:0;border-radius:12px;color:var(--ink);font:inherit;padding:12px;resize:vertical}
.tip{background:var(--panel2);border-radius:12px;padding:12px;font-size:14px;color:#c9d0d7;margin:10px 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* log */
.card{background:var(--panel);border-radius:16px;padding:16px;margin:10px 0}
.log-date{color:var(--muted);font-size:14px;display:flex;justify-content:space-between}
.log-title{font:700 24px/1.1 var(--display);margin:4px 0 10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .v{font:700 22px var(--display)}
.stat .k{color:var(--muted);font-size:13px}
.log-ex{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px}
.log-ex div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.log-ex span:last-child{color:var(--muted);text-align:right}
.rec{color:var(--pin);font-size:14px;font-weight:600;margin-top:10px}

/* progress */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-radius:12px;padding:3px;margin:4px 0 14px}
.seg button{height:36px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--panel2);color:var(--ink)}
.big-num{font:800 72px/0.9 var(--display);letter-spacing:-0.02em}
.big-num small{font:600 18px var(--body);color:var(--muted);margin-left:6px;letter-spacing:0}
.delta-up{color:var(--good)} .delta-down{color:var(--hurt)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .grid{stroke:#2c3238;stroke-width:1}
.chart .axis{fill:var(--dim);font:600 11px var(--body)}
.chart .line{fill:none;stroke:var(--pin);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--pin)}
.chart .area{fill:url(#fillgrad)}
.lift{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .nm{flex:1;min-width:0;font-weight:600}
.lift .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.lift .val{font:700 22px var(--display);text-align:right}
.lift .val small{display:block;font:600 12px var(--body)}
.spark{width:70px;height:28px;flex:none}
.spark path{fill:none;stroke:var(--muted);stroke-width:1.8}
.bars .b{display:grid;grid-template-columns:92px 1fr 54px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.bars .track{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--muted);border-radius:3px}
.bars .fill.met{background:var(--good)}
.bars .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px 0;font-size:15px}

/* body tab */
.joint{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.joint:last-child{border-bottom:0}
.joint .nm{font-weight:600;font-size:17px}
.tri{display:grid;grid-template-columns:repeat(3,auto);background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.tri button{padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.tri button.on.ok{background:#24402f;color:var(--good)}
.tri button.on.sore{background:#4a3c1c;color:var(--pin)}
.tri button.on.injured{background:#4a2722;color:var(--hurt)}
.ban{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ban:last-child{border-bottom:0}
.ban small{display:block;color:var(--muted);font-size:13px}
.ban button{color:var(--pin);font-weight:700;font-size:14px;padding:8px 2px;flex:none}
.pain{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pain:last-child{border-bottom:0}
.pain b{font-weight:600}
.pain span{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:15px;max-width:90vw;animation:fade .2s}

/* photos in lists */
.ex-open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.ex-open .ex-main{display:flex;flex-direction:column}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#fff}
.thumb.sm{width:40px;height:40px;border-radius:9px}
.thumb-none{display:grid;place-items:center;background:var(--panel2);color:var(--muted);font:700 15px var(--display)}
.ex-head{padding-left:12px}
.donechip{color:var(--good);font-weight:700}
.field.bw{justify-content:center;color:var(--dim);font-size:14px;font-weight:600}
.set.nocheck{grid-template-columns:20px 1fr 1fr}
.set.warm .set-n{color:var(--pin)}
.btn-link{display:block;margin:16px auto 0;color:var(--muted);font-weight:600;font-size:15px;padding:10px}
/* setup */
.setup{padding-top:10px}
.setup-icon{width:72px;height:72px;border-radius:18px;display:block;margin-bottom:14px}
.lbl{font-weight:700;font-size:15px;margin:22px 0 8px;color:var(--ink)}
.lbl-sub{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.text-in{width:100%;height:50px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:0 14px;font-size:17px}
.text-in:focus{outline:none;border-color:var(--pin)}
.picks{display:grid;gap:8px}
.picks.two{grid-template-columns:1fr 1fr}
.pick{text-align:left;padding:13px 14px;border-radius:14px;background:var(--panel);border:2px solid transparent;font-weight:700;font-size:16px}
.pick small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.pick.on{border-color:var(--pin)}
.chip.on-warn{background:#4a3c1c;color:var(--pin);border-color:#6b5520}
/* steps card */
.steps .steps-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.steps .track{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.steps .fill{height:100%;background:var(--pin)}
.steps .fill.met{background:var(--good)}
.steps-in input{width:100%;margin-top:10px;height:44px;border-radius:10px;background:var(--panel2);border:0;padding:0 12px;font-size:16px}
/* exercise detail */
body.noscroll{overflow:hidden}
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-bottom:calc(200px + var(--safe-b));animation:slideup .32s cubic-bezier(.2,.8,.2,1)}
.hero{position:relative;background:#fff;aspect-ratio:4/3;max-height:46vh;width:100%;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-none{height:100%;display:grid;place-items:center;background:var(--panel)}
.hero-none .mmap{width:70%}
.hero::after{content:'';position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(24,28,32,.96),rgba(24,28,32,0));pointer-events:none}
.dv-close{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;width:40px;height:40px;border-radius:50%;background:rgba(18,21,25,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;z-index:2;display:grid;place-items:center;padding:0}
.hero-foot{position:absolute;left:16px;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:2}
.hero-name{font:800 34px/0.95 var(--display);margin:0}
.howto-btn{background:rgba(43,49,56,.92);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14px;white-space:nowrap}
.dchips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:none;background:var(--panel2);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
.dpad{padding:6px 16px 0;max-width:560px;margin:0 auto}
.muscle-line{color:var(--muted);font-size:14px;margin:4px 0 10px}
.coach{background:var(--panel);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.coach-t{color:var(--pin);font-weight:700}
.coach-b{color:#c9d0d7;font-size:15px;margin-top:3px}
.trend{display:flex;gap:14px;align-items:center;margin-top:10px;font-weight:600;font-size:14px}
.trend .t{display:inline-grid;place-items:center;min-width:30px;height:22px;border-radius:11px;background:var(--panel2);margin-left:4px}
.trend .t.up{background:#24402f;color:var(--good)}
.note-show{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14px;color:#c9d0d7;margin:8px 0}
.dv-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 8px) 8px 8px;background:var(--bg);font-weight:700;font-size:17px}
.dv-back{width:40px;height:40px;border-radius:12px;font-size:28px;line-height:1;color:var(--pin)}
.dv-title{font:800 32px/1 var(--display);margin:6px 0 12px}
.howto-img{background:#fff;aspect-ratio:4/3;max-height:40vh;overflow:hidden}
.howto-img img{width:100%;height:100%;object-fit:contain;display:block}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
.steps-list{padding-left:22px;margin:4px 0;line-height:1.5}
.steps-list li{margin-bottom:10px;color:#d6dbe0}
.eq-list{padding-left:20px;line-height:1.8}
.target{background:var(--panel);border-radius:14px;padding:14px}
.mmap{width:100%;display:block}
.mmap path,.mmap circle{stroke-linejoin:round;stroke-width:4}
.mmap .mb{fill:#2b3138;stroke:#2b3138}
.mmap .mo{fill:#353c44;stroke:#353c44}
.mmap .mp{fill:var(--pin);stroke:var(--pin)}
.mmap .ms{fill:#8a6d22;stroke:#8a6d22}
.mmap .mlab{fill:var(--dim);font:600 11px var(--body);text-anchor:middle}
.tlegend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px;color:#c9d0d7}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.lg.p{background:var(--pin)} .lg.s{background:#8a6d22}
.hist{border-bottom:1px solid var(--line);padding:14px 0}
.hist h3{font:700 22px var(--display);margin:0 0 6px}
.badge{display:inline-block;background:var(--pin);color:var(--pin-ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;margin-bottom:8px}
.hset{display:flex;align-items:center;gap:10px;padding:4px 0;font-weight:600}
.hn{width:24px;height:24px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.rep-cur{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rep-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.rep-row span,.rep-cur span{display:flex;flex-direction:column;min-width:0}
.rep-row b,.rep-cur b{font-weight:700;font-size:16px}
.rep-row small,.rep-cur small{color:var(--muted);font-size:13px}
.hurt-btn{color:var(--hurt)}
#detail .timer{z-index:36}

/* Opening splash. First open: full trailer with sound. Every open after: 1.5s title slam. Then slides up. */
#splash{position:fixed;inset:0;z-index:100;background:#0d1013;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .38s cubic-bezier(.7,0,.3,1)}
#splash .sp-bg{position:absolute;inset:-40px;background:url(img/splash/end.jpg) center/cover;filter:blur(28px) brightness(.55)}
#splash .sp-box{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;background:url(img/splash/end.jpg) center/cover no-repeat;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
#splash .sp-bgv{position:absolute;left:50%;top:50%;width:140%;height:140%;transform:translate(-50%,-50%);object-fit:cover;filter:blur(26px) brightness(.62) saturate(1.25)}
#splash.first .sp-box{background-image:url(img/splash/first.jpg)}
#splash .sp-box video{width:100%;height:100%;display:block;object-fit:cover}
#splash.gone{transform:translateY(-100%)}
#splash .sp-tap{position:absolute;left:50%;bottom:calc(14% + env(safe-area-inset-bottom));transform:translateX(-50%);font:800 26px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em;color:#181c20;background:#ffc53d;border:0;border-radius:999px;padding:16px 34px;box-shadow:0 6px 24px rgba(0,0,0,.45);animation:sp-pulse 1.1s ease-in-out infinite}
#splash .sp-skip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));font:600 15px 'Barlow',sans-serif;color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:999px;padding:8px 14px}
@keyframes sp-pulse{50%{transform:translateX(-50%) scale(1.06)}}

/* Code-built muscle figure */
.fig{width:100%;height:100%;display:block}
.fig .fb{fill:url(#fgBase);stroke:#262b31;stroke-width:.8}
.fig .fhead{fill:url(#fgM)}
.fig .fm{fill:url(#fgM);stroke:#3a3f45;stroke-width:.6}
.fig .fm.t1{fill:url(#fgT1);stroke:#7d0d13}
.fig .fm.t2{fill:url(#fgT2);stroke:#7a3c10}
.fig .fib{stroke:rgba(0,0,0,.2);stroke-width:.6;fill:none}
.fig .far{opacity:.5}
.fig .fg-prop{fill:#3a434c}
.fig .fg-db circle{fill:#1c2126;stroke:#66707a;stroke-width:1.4}
.fig .fg-db .in{fill:#66707a;stroke:none}
.fig .fg-cable{stroke:#cfd4da;stroke-width:1.1}
.fig .fg-rope{stroke:#e8c66a;stroke-width:2.6;stroke-linecap:round;fill:none}
.fig .fg-handle{fill:#1c2126;stroke:#cfd4da;stroke-width:1.2}
.fig .fg-floor{stroke:#39424b;stroke-width:1.5}
.figbg{background:radial-gradient(120% 90% at 50% 35%,#2b333c,#14181c)!important}
.thumb.thumb-fig{display:block;padding:2px;overflow:hidden}

/* Motion: screens slide instead of flashing */
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes slidedown{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
@keyframes slidein{from{transform:translateX(28%);opacity:0}}
.detail.closing{animation:slidedown .26s cubic-bezier(.4,0,.8,.4) forwards;pointer-events:none}
.dv-body.v-sub{animation:slidein .24s cubic-bezier(.2,.8,.2,1)}
.dv-body.v-main{animation:fade .18s}
.detail > .dv-body.v-main:first-child{animation:none}
.scrim.closing{animation:fadeout .2s forwards;pointer-events:none}
.scrim.closing .sheet{animation:slidedown .2s ease-in forwards}
.sheet{animation:slideup .28s cubic-bezier(.2,.8,.2,1)!important}
.screen.tabin{animation:fade .2s}
.hero-fig{width:100%;height:100%;position:relative}
.fig3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero.figbg .hero-fig{height:calc(100% - 70px);margin-top:8px}
.hero.figbg{max-height:52vh}
.howto-img.figbg{aspect-ratio:4/3;max-height:40vh}
/* Sticky start button */
.cta-dock{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));padding:14px 16px 10px;background:linear-gradient(rgba(24,28,32,0),var(--bg) 40%);z-index:19}
.cta-dock .btn-main{margin:0 auto;max-width:528px}
.screen.has-cta{padding-bottom:calc(170px + var(--safe-b))}

.summary{padding-bottom:110px}
/* Drag to reorder */
.drag{width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;color:var(--dim);flex:none}
.drag svg{width:20px;height:20px;fill:currentColor}
.ex{transition:transform .18s ease}
.ex.dragging{position:relative;z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.55);transition:none;outline:2px solid var(--pin)}
body.is-dragging{user-select:none;-webkit-user-select:none}
/* Sets-left card */
.left-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 4px}
.lft{height:70px;border-radius:16px;font:800 32px var(--display);color:#fff;opacity:.5;border:3px solid transparent;transition:transform .12s,opacity .12s}
.lft.on{opacity:1;border-color:#fff;transform:scale(1.05)}
.l0{background:#d43c35}.l1{background:#e2812d}.l2{background:#b9b02a}.l3{background:#3aa556}
.btn-main:disabled{opacity:.35}
/* Summary */
.sum-stats{margin-top:16px}

.sum-row:last-child{border:0}

.ach{display:flex;gap:12px;align-items:center;padding:8px 0}
.ach-ic{width:36px;height:36px;border-radius:50%;background:var(--pin);color:var(--pin-ink);display:grid;place-items:center;font-weight:800;flex:none;font-size:18px}
.ach-ic.dim{background:var(--panel2);color:var(--ink)}
.ach small{display:block;color:var(--muted);font-size:14px}

/* v1.7 */
.xic{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.top-r{display:flex;align-items:center;gap:10px}
.lib-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:14px;flex:none;margin-bottom:4px}

.lib-chips{margin:12px 0 4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}

.lib-row small.dim{color:var(--dim)}
.lib-row{position:relative}

.card{position:relative}
.info-btn{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:700 15px/1 Georgia,serif;font-style:italic;display:grid;place-items:center;padding:0;background:none}
.info-btn.inline{position:static;display:inline-grid;vertical-align:middle;margin-left:6px;width:24px;height:24px;font-size:13px}
.h2-sub{font:500 14px var(--body);color:var(--muted);margin-left:6px}
.std{padding:10px 0;border-bottom:1px solid var(--line)}
.std:last-child{border:0}
.std-top{display:flex;justify-content:space-between;align-items:baseline}
.std-lv{color:var(--pin);font-weight:700}
.std-bar{position:relative;height:8px;border-radius:4px;margin:10px 0 4px;background:linear-gradient(90deg,#3a424b,#5b6570 25%,#8f7a3a 50%,#c99a2c 75%,#ffc53d)}
.std-bar i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--pin)}
.std-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:6px}
.bw-row{display:flex;gap:8px;align-items:center}
.bw-row .text-in{flex:1}
.bw-u{color:var(--muted)}
.btn-small{height:50px;padding:0 18px;border-radius:12px;background:var(--pin);color:var(--pin-ink);font-weight:800}
.about-row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:10px}
.about-row label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.about-row .ht{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two-btn .btn-quiet{margin-top:10px}
.chart{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart .scrub-l{stroke:#fff;stroke-width:1.2;stroke-dasharray:3 3;opacity:.8}
.chart .scrub-d{fill:var(--pin);stroke:var(--bg);stroke-width:2.5}
.chart .scrub-tip rect{fill:#0f1215;stroke:var(--line)}
.chart .scrub-v{fill:var(--ink);font:800 13px var(--body)}
.chart .scrub-t{fill:var(--muted);font:600 10px var(--body)}
.ex-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ex.pressing{transition:transform .35s ease;transform:scale(.985)}
.ex.dragging{transform-origin:center}

/* v1.8 */
.ex.dragging{transition:none!important;will-change:transform}
.ex.pressing:not(.dragging){transition:transform .3s ease;transform:scale(.985)}
.chart{touch-action:none}
.day-title{text-transform:uppercase;letter-spacing:.005em}
.block-box{border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin:4px 0 14px;background:rgba(255,255,255,.015)}
.block-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-weight:600}
.block-box .blockbar{margin:10px 0 6px}
.block-box .blocklabels{margin-bottom:0}
.dchip{display:inline-flex;align-items:center;gap:6px;flex:none}
.dchip svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dchip svg circle[r="1.3"]{fill:currentColor;stroke:none}
.dchips{gap:6px}
.dchips .dchip{padding:0 10px 0 9px;font-size:14px;gap:5px}
.dchip svg{width:16px;height:16px}
.sets{border:1px solid var(--line);border-radius:14px;margin:4px 12px 12px;padding:8px 10px 10px;background:rgba(0,0,0,.12)}
.dpad .sets{margin:12px 0 0}
.db-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.dbc{height:40px;border-radius:10px;background:var(--panel2);border:1.5px solid transparent;font-weight:700;font-size:15px;color:var(--muted)}
.dbc.on{background:var(--pin);color:var(--pin-ink)}
.dbc.odd{border-style:dashed;border-color:var(--line)}
.dbc.odd.on{border-color:transparent}
.rack-line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.rack-line b{font:700 20px var(--display)}
.rack-line span{color:var(--muted);font-size:14px}
.title-i{display:flex;align-items:center;gap:10px}
.title-i .info-btn{margin-top:4px}
.fold{background:var(--panel);border-radius:16px;margin:10px 0;overflow:hidden}
.fold-h{width:100%;display:flex;align-items:center;gap:10px;padding:16px;text-align:left}
.fold-t{font:700 21px/1 var(--display);flex:none}

.rec-row{display:grid;grid-template-columns:86px 1fr 40px;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:6px 0}

.about-note{font-size:14px;color:var(--muted);margin:0 4px 10px;line-height:1.35}

/* v2.0 */
.top h1{text-transform:uppercase}
.dchips .dchip{padding:11px 12px 11px 10px;line-height:1.15}

.detail.is-howto{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}

.hero-fig[data-orbit]{touch-action:none}
.lg.p{background:#ff2a1f!important}.lg.s{background:#ff8a2a!important}
.target .tlegend{display:flex;flex-direction:column;gap:10px;font-size:16px;padding:6px 0}
.hero-none{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font:700 22px var(--display)}
.chip.pending{box-shadow:0 0 0 2px var(--pin)}
.plan-box.dirty{border:1px solid var(--pin)}
.plan-save{display:flex;align-items:center;gap:14px;margin-top:14px}
.plan-save .btn-main{margin:0;flex:1;height:52px;font-size:21px}
.plan-save .btn-link{margin:0;flex:none}
.ver-tap{-webkit-user-select:none;user-select:none}
.pull-tab{display:block;width:100%;margin:22px 0 0;padding:8px 16px 16px;border-radius:20px 20px 14px 14px;background:var(--panel);border:1px solid var(--line);border-bottom-width:0;box-shadow:0 -6px 18px rgba(0,0,0,.25);text-align:left;color:var(--ink)}
.pull-tab:active{transform:translateY(-2px)}
.pt-grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.pt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}

.plan-box .pull-tab{margin:16px -4px -6px;width:calc(100% + 8px)}
/* no lone last words: titles split evenly, paragraphs never end on one word */
h1,h2,h3,.ex-name,.hero-name,.dv-title,.sum-name,.fold-t,.pt-row span,.lift .nm,.rep-row b,.btn-main,.btn-quiet,.row-btn span,.coach-t,.std-top b,.inj-top b{text-wrap:balance}
p,.sub,.tip,.coach-b,.steps-list li,.inj-tip,.about-note,.empty,.avoid,.ex-meta,.rep-row small,.ach small,.toast,.sheet p,.pain{text-wrap:pretty}
.spin-hint{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);background:rgba(0,0,0,.3);padding:3px 8px;border-radius:999px;pointer-events:none}
.ex-note{display:flex;gap:6px;align-items:flex-start;margin:0 12px 10px;padding:8px 10px;border-radius:10px;background:rgba(255,197,61,.08);color:#e9d7a6;font-size:13.5px;line-height:1.35}
.std-info{display:flex;justify-content:flex-end;margin:-2px 0 4px}
.std-info .btn-link{margin:0;padding:4px 0;font-size:14px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="splash"><div class="sp-bg"></div><div class="sp-box"></div></div>
<script>
(function(){
  var sp=document.getElementById('splash'), box=sp.querySelector('.sp-box'), done=false, FLAG='gfj.introSeen';
  var first=false; try{ first=!localStorage.getItem(FLAG); }catch(e){}
  function hide(){ if(done) return; done=true; try{ localStorage.setItem(FLAG,'1'); }catch(e){}
    sp.querySelectorAll('video').forEach(function(x){ x.pause(); });
    sp.classList.add('gone'); setTimeout(function(){ sp.remove(); }, 450); }
  var v=document.createElement('video'); v.setAttribute('playsinline',''); v.playsInline=true; v.preload='auto';
  box.appendChild(v); v.addEventListener('ended', hide);
  // a blurred, muted copy of the same video fills the screen above and below, kept in step with the real one
  var bg=document.createElement('video'); bg.className='sp-bgv'; bg.muted=true; bg.setAttribute('muted',''); bg.setAttribute('playsinline',''); bg.playsInline=true; bg.preload='auto';
  sp.insertBefore(bg, box);
  v.addEventListener('playing', function(){ bg.src=v.currentSrc||v.src; try{ bg.currentTime=v.currentTime; }catch(e){} var b=bg.play(); if(b&&b.catch) b.catch(function(){}); });
  v.addEventListener('timeupdate', function(){ if(bg.readyState>1 && Math.abs(bg.currentTime-v.currentTime)>0.25){ try{ bg.currentTime=v.currentTime; }catch(e){} } });
  if(first){
    // First time on this phone: the whole trailer, with sound. Phones block sound until a tap,
    // so if autoplay with sound is refused, show a Tap to start button.
    sp.classList.add('first'); v.src='img/splash/trailer.mp4'; v.muted=false;
    var skip=document.createElement('button'); skip.className='sp-skip'; skip.textContent='Skip'; skip.onclick=hide; sp.appendChild(skip);
    var p=v.play();
    if(p&&p.catch) p.catch(function(){
      var tap=document.createElement('button'); tap.className='sp-tap'; tap.textContent='TAP TO START';
      tap.onclick=function(){ tap.remove(); v.muted=false; v.play().catch(function(){ v.muted=true; v.play().catch(hide); }); };
      sp.appendChild(tap);
    });
    v.addEventListener('error', hide);
  } else {
    // Every open after: the 1.5s title slam, silent, then slide away. Tap to skip; never longer than 2.2s.
    v.muted=true; v.autoplay=true; v.src='img/splash/open.mp4';
    var q=v.play(); if(q&&q.catch) q.catch(function(){ v.style.display='none'; setTimeout(hide, 900); });
    v.addEventListener('error', function(){ v.style.display='none'; setTimeout(hide, 900); });
    sp.addEventListener('click', hide); setTimeout(hide, 2200);
  }
})();
</script>
