<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Get F*ing Jacked!">
<meta name="theme-color" content="#181c20">
<title>Get F*ing Jacked!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181c20; --panel:#22272d; --panel2:#2b3138; --line:#363d45;
  --ink:#eceff2; --muted:#8e98a3; --dim:#5d6670;
  --pin:#ffc53d; --pin-ink:#1d1a10; --good:#5fd39a; --hurt:#ff7a66;
  --display:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body:'Barlow', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.screen{padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto}
.screen.has-timer{padding-bottom:calc(190px + var(--safe-b))}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.kicker{color:var(--muted);font-weight:500;font-size:15px}
h1{font:800 44px/0.95 var(--display);margin:2px 0 0;letter-spacing:-0.01em;text-transform:none}
h2{font:700 26px/1 var(--display);margin:28px 0 12px}
.sub{color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{border-color:#5a3a33;color:#ffb3a6}

/* block meter: 4 weeks */
.blockbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 6px}
.blockbar i{height:6px;border-radius:2px;background:var(--line)}
.blockbar i.past{background:var(--dim)}
.blockbar i.now{background:var(--pin)}
.blocklabels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--dim);font-weight:600}
.blocklabels span.now{color:var(--pin)}

.avoid{margin:14px 0 4px;padding:12px 14px;background:#2a2321;border-radius:12px;font-size:14px;color:#f3c9bf}
.avoid b{color:#ffd8cf}

/* exercise list */
.ex{background:var(--panel);border-radius:16px;margin:10px 0;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;width:100%;text-align:left}
.ex-main{flex:1;min-width:0}
.ex-name{font:700 21px/1.1 var(--display)}
.ex-meta{color:var(--muted);font-size:14px;margin-top:3px}
.ex.done .ex-name{color:var(--muted)}
.ex-more{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
.ex-more:active{background:var(--panel2)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ex.done .tick{background:var(--good);border-color:var(--good)}
.ex.done .tick::after{content:'';width:10px;height:6px;border:2.5px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.first{display:inline-block;color:var(--pin);font-weight:600}

.sets{padding:0 12px 12px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 52px;gap:7px;align-items:center;padding:5px 0}
.set-head{padding:0;color:var(--dim);font-size:12px;font-weight:600;text-align:center}
.set-n{color:var(--dim);font:700 18px var(--display);text-align:center}
.field{display:flex;align-items:center;background:var(--panel2);border-radius:12px;height:52px;overflow:hidden}
.field button{width:32px;height:100%;color:var(--muted);font-size:22px;flex:none}
.field button:active{background:var(--line)}
.field input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;font:700 23px var(--display);padding:0;font-variant-numeric:tabular-nums}
.field input:focus{outline:none;background:#323941}
.field .unit{font-size:12px;color:var(--dim);margin-right:6px;font-weight:600}
.check{height:52px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:24px;height:24px;stroke:var(--dim)}
.set.done .check{background:var(--good);border-color:var(--good)}
.set.done .check svg{stroke:var(--bg)}
.set.done .field input{color:var(--muted)}
.set-actions{display:flex;gap:8px;margin-top:6px}
.ghost{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.ghost:active{background:var(--panel2)}

.btn-main{display:block;width:100%;height:58px;border-radius:16px;background:var(--pin);color:var(--pin-ink);font:800 24px var(--display);letter-spacing:0.01em;margin-top:18px}
.btn-main:active{filter:brightness(0.92)}
.btn-quiet{display:block;width:100%;height:50px;border-radius:14px;border:1px solid var(--line);font-weight:600;color:var(--ink);margin-top:10px}
.btn-danger{color:var(--hurt)}
.elapsed{font:700 26px var(--display);color:var(--pin);font-variant-numeric:tabular-nums}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(24,28,32,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke:var(--pin)}

/* rest timer dock: a weight stack that drains */
.timer{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--safe-b));z-index:30;max-width:540px;margin:0 auto;background:#0f1215;border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:62px 1fr;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,0.5)}
.timer.over{border-color:var(--pin)}
.stack{display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%;min-height:96px;position:relative;padding:0 6px}
.plate{height:6px;border-radius:2px;background:#2a3037;transition:background .3s}
.plate.lit{background:#59636e}
.plate.pin{background:var(--pin)}
.timer-body{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.timer-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.timer-label{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-time{font:800 54px/0.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.timer.over .timer-time{color:var(--pin)}
.timer-btns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:10px}
.timer-btns button{height:42px;border-radius:12px;background:var(--panel2);font-weight:700}
.timer-btns button.skip{background:var(--ink);color:var(--bg)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safe-b));max-height:86dvh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:700 26px/1.05 var(--display);margin:4px 0 6px}
.sheet p{color:var(--muted);margin:0 0 12px;font-size:15px}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
.row-btn:last-child{border-bottom:0}
.row-btn small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.row-btn .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:17px}
.row-btn.hurt .ic{background:#3a2622;color:var(--hurt)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.opt{height:50px;border-radius:12px;background:var(--panel2);font-weight:700;border:2px solid transparent}
.opt.on{border-color:var(--pin);color:var(--pin)}
textarea{width:100%;min-height:70px;background:var(--panel2);border:0;border-radius:12px;color:var(--ink);font:inherit;padding:12px;resize:vertical}
.tip{background:var(--panel2);border-radius:12px;padding:12px;font-size:14px;color:#c9d0d7;margin:10px 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* log */
.card{background:var(--panel);border-radius:16px;padding:16px;margin:10px 0}
.log-date{color:var(--muted);font-size:14px;display:flex;justify-content:space-between}
.log-title{font:700 24px/1.1 var(--display);margin:4px 0 10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .v{font:700 22px var(--display)}
.stat .k{color:var(--muted);font-size:13px}
.log-ex{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px}
.log-ex div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.log-ex span:last-child{color:var(--muted);text-align:right}
.rec{color:var(--pin);font-size:14px;font-weight:600;margin-top:10px}

/* progress */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-radius:12px;padding:3px;margin:4px 0 14px}
.seg button{height:36px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--panel2);color:var(--ink)}
.big-num{font:800 72px/0.9 var(--display);letter-spacing:-0.02em}
.big-num small{font:600 18px var(--body);color:var(--muted);margin-left:6px;letter-spacing:0}
.delta-up{color:var(--good)} .delta-down{color:var(--hurt)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .grid{stroke:#2c3238;stroke-width:1}
.chart .axis{fill:var(--dim);font:600 11px var(--body)}
.chart .line{fill:none;stroke:var(--pin);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--pin)}
.chart .area{fill:url(#fillgrad)}
.lift{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .nm{flex:1;min-width:0;font-weight:600}
.lift .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.lift .val{font:700 22px var(--display);text-align:right}
.lift .val small{display:block;font:600 12px var(--body)}
.spark{width:70px;height:28px;flex:none}
.spark path{fill:none;stroke:var(--muted);stroke-width:1.8}
.bars .b{display:grid;grid-template-columns:92px 1fr 54px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.bars .track{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--muted);border-radius:3px}
.bars .fill.met{background:var(--good)}
.bars .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px 0;font-size:15px}

/* body tab */
.joint{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.joint:last-child{border-bottom:0}
.joint .nm{font-weight:600;font-size:17px}
.tri{display:grid;grid-template-columns:repeat(3,auto);background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.tri button{padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.tri button.on.ok{background:#24402f;color:var(--good)}
.tri button.on.sore{background:#4a3c1c;color:var(--pin)}
.tri button.on.injured{background:#4a2722;color:var(--hurt)}
.ban{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ban:last-child{border-bottom:0}
.ban small{display:block;color:var(--muted);font-size:13px}
.ban button{color:var(--pin);font-weight:700;font-size:14px;padding:8px 2px;flex:none}
.pain{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pain:last-child{border-bottom:0}
.pain b{font-weight:600}
.pain span{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:15px;max-width:90vw;animation:fade .2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" class="screen"></main>
<div id="timer"></div>
<nav class="tabs" id="tabs"></nav>
<div id="overlay"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
